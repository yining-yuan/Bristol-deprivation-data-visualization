<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<title>How deprivation happens in Bristol</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#ffffff}
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
  .stage{position:relative;width:min(1006px,100%);aspect-ratio:1006 / 842}
  .stage img{width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
  .hot{position:absolute;border-radius:50%;display:block;cursor:pointer;transition:box-shadow .22s ease, transform .22s ease}
  .hot:hover{transform:scale(1.015);box-shadow:0 0 0 3px rgba(255,255,255,.85), 0 18px 40px -14px rgba(26,31,28,.55)}
  .hot:focus-visible{outline:3px solid #b0432b;outline-offset:2px}
  /* Opportunity and place → Education */
  .op{left:45%;top:4%;width:54%;height:47%}
  /* Health and wellbeing → Housing */
  .he{left:8%;top:29%;width:34%;height:46%}
  /* Home and environment → Housing */
  .ho{left:41%;top:55%;width:41%;height:44%}
  .corner{position:fixed;top:16px;right:18px;font:500 11px/1.6 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;color:#4a544e;text-align:right}
  /* keep the search bar clear of the corner links on narrow screens */
  @media(max-width:900px){ .corner{top:auto;bottom:96px;right:50%;transform:translateX(50%);text-align:center} body{padding-top:70px} }
</style>
<script src="bristol-data-ons-census.js"></script>

<body>

<script>
  // fuzzy search across every indicator in both ranked stories
  (function(){
    function start(){
      if(!window.BRISTOL_SEARCH||!window.BRISTOL_DATA) return false;
      window.BRISTOL_SEARCH.init({
        page:'index',
        placeholder:'Search every indicator — try “child poverty”, “overcrowdin”, “no quals”'
      });
      return true;
    }
    if(!start()){ var t=setInterval(function(){ if(start()) clearInterval(t); },80); setTimeout(function(){clearInterval(t);},6000); }
